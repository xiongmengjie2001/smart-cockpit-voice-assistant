          \                results.append('【未执行】请说明明确操作，例如空调调到22度或关闭车窗。'); status='clarify';\
          \ break\n            if i=='window' and a=='close': val=0\n            if\
          \ i=='window' and a=='open' and val is None: val=100\n            if type(val)\
          \ not in (int,float) or not math.isfinite(val):\n                pending(idx,'clarify','value','请补充'+('温度，例如22度。'\
          \ if i=='climate' else '车窗开度，例如50%。')); status='clarify'; break\n      \
          \      key=t+('_temperature' if i=='climate' else '_window_percent')\n \
          \           final=s[key]+val if a=='adjust' else val\n            lo,hi=(16,30)\
          \ if i=='climate' else (0,100)\n            if not lo<=final<=hi:\n    \
          \            results.append('【未执行】数值超出演示范围'+str(lo)+'～'+str(hi)+'。'); status='rejected';\
          \ break\n            if i=='window' and float(speed)>0 and final>s[key]:\n\
