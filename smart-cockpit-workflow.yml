          \ try:\n  t=raw.rsplit('</think>',1)[-1].strip()\n  if t.startswith('```'):t=t.split('\\\
          n',1)[1].rsplit('```',1)[0].strip()\n  obj=json.loads(t); refs=json.loads(sources)\n\
          \  ids=obj.get('citations',[])\n  if obj.get('supported') is not True or\
          \ not isinstance(obj.get('answer'),str) or not obj['answer'].strip() or\
          \ not isinstance(ids,list) or not ids:raise ValueError()\n  if any(type(i)!=int\
