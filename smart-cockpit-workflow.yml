app:
  name: 特斯拉 Model 3｜多分支语音助手·模拟版
  description: 完善版：6类分支、确认/取消/补槽/过期、顺序多任务、失败回执、状态记忆、Top3官方手册RAG与无证据兜底。模拟演示，不是特斯拉实车策略。
  icon: 🚗
  icon_type: emoji
  icon_background: '#D5F5F6'
  mode: advanced-chat
  use_icon_as_answer_icon: false
kind: app
version: 0.6.0
dependencies: []
workflow:
  conversation_variables:
  - id: da39bb24-d9a6-4b0a-b22a-5152122c1e67
    name: vehicle_state
    description: 模拟车况、分座位最近成功操作、120秒待确认/待补充任务；不是实车数据。
    value_type: string
    value: '{"driver_temperature": 24, "passenger_temperature": 24, "driver_window_percent":
      0, "passenger_window_percent": 0, "trunk_open": false, "playing": false, "playlist":
      "", "destination": "", "last_by_seat": {}, "pending": {}}'
    selector:
    - conversation
    - vehicle_state
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: Model 3车载助手·完整模拟版（非官方、非实车）。空调/车窗/音乐/导航支持多分支和最多5条独立指令。后备箱需停稳P挡并确认，待处理任务120秒过期；可说“取消”。缺温度可直接补数字，缺地点/歌名请回复“补充：内容”。[主驾]/[副驾]仅人工声源标记。网络和故障在预览输入中模拟。RAG引用现有中国版Model
      3 2024+手册；尚未接真实麦克风、音箱或车辆。
    suggested_questions:
    - 空调调到22度，再播放通勤歌单
    - 打开后备箱
    - 导航到上海虹桥站
    - Model 3如何锁定后车窗？
    suggested_questions_after_answer:
      enabled: false
    speech_to_text:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
  graph:
    nodes:
    - id: start
      type: custom
      position:
        x: 0
        y: 650
      width: 280
      height: 110
      sourcePosition: right
      targetPosition: left
      data:
        title: 01 输入与模拟车况（非实车）
        type: start
        desc: ''
        selected: false
        variables:
        - variable: speed
          label: 模拟车速 km/h
          type: number
          required: true
          default: 0
        - variable: gear
          label: 模拟挡位
          type: select
          options:
          - P
          - D
          - R
          - N
          required: true
          default: P
        - variable: seat
          label: 说话座位
          type: select
          options:
          - driver
          - passenger
          required: true
          default: driver
        - variable: network
          label: 模拟网络
          type: select
          options:
          - online
          - offline
          required: true
          default: online
        - variable: mock_failure
          label: 模拟接口故障
          type: select
          options:
          - none
          - timeout
          required: true
          default: none
    - id: speaker
      type: custom
      position:
        x: 340
        y: 650
      width: 280
      height: 110
      sourcePosition: right
      targetPosition: left
      data:
        title: 02 人工声源标记（非真实定位）
        type: code
        desc: ''
        selected: false
        code_language: python3
        code: "import re\ndef main(query, seat):\n    m=re.match(r'^\\s*[【\\[]\\s*(主驾|副驾)\\\
          s*[】\\]]\\s*',query)\n    speaker=('driver' if m.group(1)=='主驾' else 'passenger')\
          \ if m else seat\n    return {'speaker':speaker,'utterance':query[m.end():]\
          \ if m else query}\n"
        variables:
        - variable: query
          value_selector:
          - sys
          - query
          value_type: string
        - variable: seat
          value_selector:
          - start
          - seat
          value_type: string
        outputs:
          speaker:
            type: string
            children: null
          utterance:
            type: string
            children: null
        error_strategy: fail-branch
    - id: context
      type: custom
      position:
        x: 680
        y: 650
      width: 280
      height: 110
      sourcePosition: right
      targetPosition: left
      data:
        title: 03 会话预检 · 确认/取消/补充/过期
        type: code
        desc: ''
        selected: false
        code_language: python3
        code: "\"\"\"Deterministic simulated vehicle engine; no hardware/network access.\"\
          \"\"\nimport copy\nimport json\nimport math\nimport re\nimport time\n\n\
          INITIAL = {'driver_temperature': 24, 'passenger_temperature': 24,\n    \
          \       'driver_window_percent': 0, 'passenger_window_percent': 0,\n   \
          \        'trunk_open': False, 'playing': False, 'playlist': '',\n      \
          \     'destination': '', 'last_by_seat': {}, 'pending': {}}\n\n\ndef dump(value):\n\
          \    return json.dumps(value, ensure_ascii=False, allow_nan=False)\n\n\n\
          def load_state(raw):\n    s = json.loads(raw)\n    if not isinstance(s,\
          \ dict):\n        raise ValueError('invalid state')\n    out = copy.deepcopy(INITIAL)\n\
          \    out.update(s)\n    for seat in ('driver', 'passenger'):\n        for\
          \ suffix, lo, hi in (('_temperature', 16, 30), ('_window_percent', 0, 100)):\n\
          \            v = out[seat + suffix]\n            if type(v) not in (int,\
          \ float) or not math.isfinite(v) or not lo <= v <= hi:\n               \
          \ raise ValueError('invalid state value')\n    if not isinstance(out['pending'],\
          \ dict) or not isinstance(out['last_by_seat'], dict):\n        raise ValueError('invalid\
          \ memory')\n    return out\n\n\ndef valid_context(speed, gear, speaker,\
          \ network):\n    try:\n        n = float(speed)\n        return (math.isfinite(n)\
          \ and 0 <= n <= 250 and gear in ('P', 'D', 'R', 'N')\n                and\
          \ speaker in ('driver', 'passenger') and network in ('online', 'offline')\n\
          \                and not (gear == 'P' and n > 0))\n    except (TypeError,\
          \ ValueError):\n        return False\n\n\ndef prepare(state, utterance,\
          \ speaker, speed, gear, network):\n    \"\"\"Exact confirmation/slot replies\
          \ avoid another model call.\"\"\"\n    now = time.time()\n    q = str(utterance).strip()[:1000]\n\
          \    out = dict(mode='parse', state=state, context='{}', commands='[]',\
          \ confirmed=0,\n               message='', utterance=q)\n    try:\n    \
          \    s = load_state(state)\n    except Exception:\n        return dict(out,\
          \ mode='respond', message='会话状态异常，本轮未执行。请新建对话重试。')\n    pending = s.get('pending',\
          \ {})\n    exact = re.sub(r'[\\s。！!，,？?]', '', q)\n    cancel = exact in\
          \ ('取消', '算了', '不执行', '不要了')\n    confirm = exact in ('确认', '确认执行', '确定',\
          \ '是的')\n    expired = bool(pending) and now > pending.get('expires', 0)\n\
          \    if expired:\n        s['pending'] = {}; pending = {}\n    if not valid_context(speed,\
          \ gear, speaker, network):\n        s['pending'] = {}\n        return dict(out,\
          \ mode='respond', state=dump(s), message='模拟车况无效或车速与挡位冲突，本轮未执行。请检查预览输入。')\n\
          \    if cancel:\n        if pending and pending.get('speaker') != speaker:\n\
          \            msg = '请由发起操作的座位取消，本轮未执行。'\n        else:\n            s['pending']\
          \ = {}; msg = '已取消待处理操作，车辆模拟状态未改变。' if pending else '当前没有待处理操作。'\n     \
          \   return dict(out, mode='respond', state=dump(s), message=msg)\n    if\
          \ confirm:\n        if not pending:\n            msg = '待处理操作已过期，请重新发出完整指令。'\
          \ if expired else '当前没有可确认的操作，请说出完整指令。'\n            return dict(out, mode='respond',\
          \ state=dump(s), message=msg)\n        if pending.get('speaker') != speaker:\n\
          \            return dict(out, mode='respond', state=dump(s), message='请由发起操作的座位确认，本轮未执行。')\n\
          \        if pending.get('kind') != 'confirm':\n            return dict(out,\
          \ mode='respond', state=dump(s), message='还缺少具体信息，单说确认不能执行。' + pending.get('question',\
          \ ''))\n        commands = pending['commands']; s['pending'] = {}\n    \
          \    return dict(out, mode='direct', state=dump(s), commands=dump(commands),\
          \ confirmed=1)\n    if pending and pending.get('kind') == 'clarify' and\
          \ pending.get('speaker') == speaker:\n        commands = copy.deepcopy(pending['commands']);\
          \ c = commands[0]\n        slot = pending.get('slot'); accepted = False\n\
          \        if slot == 'value':\n            m = re.fullmatch(r'(-?\\d+(?:\\\
          .\\d+)?)(?:度|摄氏度|%|％)?', q)\n            if m:\n                c['value']\
          \ = float(m.group(1)); accepted = True\n        elif slot == 'target' and\
          \ exact in ('主驾', '副驾'):\n            c['target'] = 'driver' if exact ==\
          \ '主驾' else 'passenger'; accepted = True\n        elif slot == 'query' and\
          \ q.startswith('补充：') and len(q) > 3:\n            c['query'] = q[3:].strip()[:120];\
          \ accepted = True\n        elif slot == 'action' and exact in ('打开', '关闭'):\n\
          \            c['action'] = 'open' if exact == '打开' else 'close'; accepted\
          \ = True\n        if accepted:\n            s['pending'] = {}\n        \
          \    return dict(out, mode='direct', state=dump(s), commands=dump(commands))\n\
          \    # A new explicit task replaces only this speaker's unfinished task.\n\
          \    if pending and pending.get('speaker') != speaker:\n        return dict(out,\
          \ mode='respond', state=dump(s), message='另一座位有待处理操作，请先由该座位确认或取消；本轮未执行。')\n\
          \    s['pending'] = {}\n    recent = s['last_by_seat'].get(speaker, {})\n\
          \    if now - recent.get('time', 0) > 300:\n        recent = {}\n    return\
          \ dict(out, state=dump(s), context=dump({'speaker': speaker, 'recent_success':\
          \ recent}))\n\n\ndef parse_commands(raw):\n    text = str(raw).rsplit('</think>',\
          \ 1)[-1].strip()\n    if text.startswith('```'):\n        text = text.split('\\\
          n', 1)[1].rsplit('```', 1)[0].strip()\n    cs = json.loads(text)['commands']\n\
          \    if not isinstance(cs, list) or not 1 <= len(cs) <= 5:\n        raise\
          \ ValueError('count')\n    allowed = {'climate','window','trunk','media','navigation','knowledge','context','clarify','unsupported'}\n\
          \    for c in cs:\n        if not isinstance(c, dict) or c.get('intent')\
          \ not in allowed:\n            raise ValueError('intent')\n        if not\
          \ isinstance(c.get('action', ''), str) or not isinstance(c.get('target',\
          \ ''), str):\n            raise ValueError('action')\n        for k in ('query',\
          \ 'question'):\n            if not isinstance(c.get(k, ''), str) or len(c.get(k,\
          \ '')) > 1000:\n                raise ValueError('text')\n    return cs\n\
          \n\ndef route(raw):\n    out = dict(route='blocked', commands='[]', query='',\
          \ message='未可靠识别，本轮未执行。请重新描述。')\n    try:\n        cs = parse_commands(raw)\n\
          \        if any(c['intent'] == 'knowledge' for c in cs):\n            if\
          \ len(cs) != 1:\n                return dict(out, message='请把手册问题和操作分开发送，每次问一个手册问题。本轮未执行。')\n\
          \            q = cs[0].get('query', '').strip()\n            if not q:\n\
          \                return out\n            return dict(out, route='knowledge',\
          \ query=q[:400], commands=dump(cs), message='')\n        if len(cs) > 1:\n\
          \            return dict(out, route='multi', commands=dump(cs), message='')\n\
          \        i = cs[0]['intent']\n        if i in ('clarify', 'unsupported'):\n\
          \            return dict(out, message=cs[0].get('question') or '请说出明确操作。本演示不控制油门、刹车、转向或辅助驾驶。')\n\
          \        return dict(out, route=i if i in ('media','navigation') else 'vehicle',\
          \ commands=dump(cs), message='')\n    except Exception:\n        return\
          \ out\n\n\ndef execute(commands, state, speed, gear, speaker, network, confirmed=0,\
          \ mock_failure='none'):\n    \"\"\"Sequential commit per successful mock\
          \ receipt; stop at pending/failure.\"\"\"\n    s = load_state(state)\n \
          \   cs = json.loads(commands)\n    results = []\n    if not valid_context(speed,\
          \ gear, speaker, network):\n        s['pending'] = {}\n        return {'state':dump(s),'reply':'车况校验失败，本轮未执行。','display':'','status':'rejected'}\n\
          \    if not isinstance(cs,list) or not 1 <= len(cs) <= 5:\n        return\
          \ {'state':dump(s),'reply':'指令列表无效，本轮未执行。','display':'','status':'rejected'}\n\
          \    s['pending'] = {}\n    status = 'success'\n    def pending(idx, kind,\
          \ slot, question):\n        s['pending'] = dict(kind=kind, slot=slot, question=question,\
          \ commands=cs[idx:],\n                            speaker=speaker, expires=time.time()+120)\n\
          \        results.append('【待'+('确认' if kind=='confirm' else '补充')+'】'+question+'（120秒内有效，可说“取消”）')\n\
          \    for idx, c in enumerate(cs):\n        if not isinstance(c,dict):\n\
          \            results.append('【未执行】无效指令。'); status='rejected'; break\n  \
          \      i=c.get('intent'); a=c.get('action',''); t=c.get('target') or speaker;\
          \ val=c.get('value')\n        q=c.get('query','')\n        if not isinstance(q,str):\
          \ q=''\n        if i=='context':\n            last=s['last_by_seat'].get(speaker,{})\n\
          \            if time.time()-last.get('time',0)>300 or last.get('intent')!='window':\n\
          \                results.append('【未执行】请明确对象，例如“关闭主驾车窗”。'); status='clarify';\
          \ break\n            i='window'; t=last['target']; c.update(intent=i,target=t)\n\
          \        if i not in ('climate','window','trunk','media','navigation'):\n\
          \            results.append('【未执行】'+(c.get('question') or '不支持该操作或指令不明确。'));\
          \ status='rejected'; break\n        if t not in ('driver','passenger'):\n\
          \            pending(idx,'clarify','target','请说明主驾还是副驾。'); status='clarify';\
          \ break\n        draft=copy.deepcopy(s)\n        label='主驾' if t=='driver'\
          \ else '副驾'\n        if i in ('climate','window'):\n            if a not\
          \ in (('set','adjust') if i=='climate' else ('set','adjust','open','close')):\n\
          \                results.append('【未执行】请说明明确操作，例如空调调到22度或关闭车窗。'); status='clarify';\
          \ break\n            if i=='window' and a=='close': val=0\n            if\
          \ i=='window' and a=='open' and val is None: val=100\n            if type(val)\
          \ not in (int,float) or not math.isfinite(val):\n                pending(idx,'clarify','value','请补充'+('温度，例如22度。'\
          \ if i=='climate' else '车窗开度，例如50%。')); status='clarify'; break\n      \
          \      key=t+('_temperature' if i=='climate' else '_window_percent')\n \
          \           final=s[key]+val if a=='adjust' else val\n            lo,hi=(16,30)\
          \ if i=='climate' else (0,100)\n            if not lo<=final<=hi:\n    \
          \            results.append('【未执行】数值超出演示范围'+str(lo)+'～'+str(hi)+'。'); status='rejected';\
          \ break\n            if i=='window' and float(speed)>0 and final>s[key]:\n\
          \                results.append('【拒绝】演示保守规则：行驶中不增加车窗开度；确认不能绕过。'); status='rejected';\
          \ break\n            draft[key]=final\n            msg=label+('空调已调到'+str(final)+'℃'\
          \ if i=='climate' else '车窗开度已设为'+str(final)+'%')\n        elif i=='trunk':\n\
          \            if float(speed)!=0 or gear!='P':\n                results.append('【拒绝】请停稳并挂P挡后再操作后备箱；确认不能绕过。');\
          \ status='rejected'; break\n            if a not in ('open','close'):\n\
          \                pending(idx,'clarify','action','请说明打开还是关闭后备箱。'); status='clarify';\
          \ break\n            if not (confirmed==1 and idx==0):\n               \
          \ pending(idx,'confirm','', '即将'+('打开' if a=='open' else '关闭')+'模拟后备箱，请确认周围无人及障碍后回复“确认”。');\
          \ status='confirm'; break\n            draft['trunk_open']=a=='open'; msg='后备箱已'+('打开'\
          \ if a=='open' else '关闭')\n        elif i=='media':\n            if a=='pause':\
          \ draft['playing']=False; msg='音乐已暂停'\n            elif a=='play':\n   \
          \             if not q.strip():\n                    pending(idx,'clarify','query','请回复“补充：歌曲或歌单名称”，或直接重说完整播放指令。');\
          \ status='clarify'; break\n                if network=='offline':\n    \
          \                results.append('【未执行】模拟离线，在线音乐不可用；可暂停现有播放。'); status='failed';\
          \ break\n                draft.update(playing=True,playlist=q[:120]); msg='正在播放：'+q[:120]+'（不输出实际音乐）'\n\
          \            else:\n                results.append('【未执行】媒体仅支持播放或暂停。');\
          \ status='clarify'; break\n        else:\n            if not q.strip():\n\
          \                pending(idx,'clarify','query','请回复“补充：目的地”，或直接重说完整导航指令。');\
          \ status='clarify'; break\n            if a not in ('query','set','open','navigate',''):\n\
          \                results.append('【未执行】导航操作不明确。'); status='rejected'; break\n\
          \            if network=='offline':\n                results.append('【未执行】模拟离线，不能生成在线路线。');\
          \ status='failed'; break\n            if q.strip() in ('家','公司'):\n    \
          \            pending(idx,'clarify','query','尚未设置'+q+'的位置，请回复“补充：具体地点”。');\
          \ status='clarify'; break\n            draft['destination']=q[:120]; msg='导航目的地：'+q[:120]+'；28分钟/12.8公里为固定演示数据'\n\
          \        # Simulate a tool receipt; no state is committed when receipt fails.\n\
          \        receipt={'ok':mock_failure=='none','updated_state':draft}\n   \
          \     if not receipt['ok']:\n            results.append('【失败】模拟接口超时，未更新本项状态；未自动重试。');\
          \ status='failed'; break\n        s=receipt['updated_state']\n        s['last_by_seat'][speaker]={'intent':i,'target':t,'time':time.time()}\n\
          \        results.append('【已完成·模拟】'+msg)\n    else:\n        idx=len(cs)-1\n\
          \    if status!='success' and idx+1<len(cs):\n        results.append('后续'+str(len(cs)-idx-1)+'项'+('随待处理任务保留，尚未执行。'\
          \ if s['pending'] else '已停止，请重新发出指令。'))\n    if status in ('failed','rejected'):\n\
          \        s['pending']={}\n    view={k:v for k,v in s.items() if k not in\
          \ ('pending','last_by_seat')}\n    return {'state':dump(s),'reply':'\\n'.join(results),\
          \ 'display':'模拟车辆状态：'+dump(view), 'status':status}\n\ndef main(state,utterance,speaker,speed,gear,network):\n\
          \ return prepare(state,utterance,speaker,speed,gear,network)\n"
        variables:
        - variable: state
          value_selector:
          - conversation
          - vehicle_state
          value_type: string
        - variable: utterance
          value_selector:
          - speaker
          - utterance
          value_type: string
        - variable: speaker
          value_selector:
          - speaker
          - speaker
          value_type: string
        - variable: speed
          value_selector:
          - start
          - speed
          value_type: number
        - variable: gear
          value_selector:
          - start
          - gear
          value_type: string
        - variable: network
          value_selector:
          - start
          - network
          value_type: string
        outputs:
          mode:
            type: string
            children: null
          state:
            type: string
            children: null
          context:
            type: string
            children: null
          commands:
            type: string
            children: null
          confirmed:
            type: number
            children: null
          message:
            type: string
            children: null
          utterance:
            type: string
            children: null
        error_strategy: fail-branch
    - id: pre_save
      type: custom
      position:
        x: 1020
        y: 650
      width: 280
      height: 110
      sourcePosition: right
      targetPosition: left
      data:
        title: 04 写回待处理任务状态
        type: assigner
        desc: ''
        selected: false
        version: '2'
        items:
        - variable_selector:
          - conversation
          - vehicle_state
          input_type: variable
          operation: over-write
          value:
          - context
          - state
    - id: pre_gate
      type: custom
      position:
        x: 1360
        y: 650
      width: 280
      height: 110
      sourcePosition: right
      targetPosition: left
      data:
        title: 05 精确回复短路 · 节省模型调用
        type: if-else
        desc: ''
        selected: false
        cases:
        - id: direct
          case_id: direct
          logical_operator: and
          conditions:
          - id: 69a77352-2c99-415e-a07d-686bca1f2354
            variable_selector: &id001
            - context
            - mode
            varType: string
            comparison_operator: is
            value: direct
        - id: respond
          case_id: respond
          logical_operator: and
          conditions:
          - id: 3005d788-8bea-4aa6-8bae-b8cc5924f1ad
            variable_selector: *id001
            varType: string
            comparison_operator: is
            value: respond
    - id: pre_answer
      type: custom
      position:
        x: 1700
        y: 250
      width: 280
      height: 110
      sourcePosition: right
