          \    if not isinstance(cs, list) or not 1 <= len(cs) <= 5:\n        raise\
          \ ValueError('count')\n    allowed = {'climate','window','trunk','media','navigation','knowledge','context','clarify','unsupported'}\n\
          \    for c in cs:\n        if not isinstance(c, dict) or c.get('intent')\
          \ not in allowed:\n            raise ValueError('intent')\n        if not\
          \ isinstance(c.get('action', ''), str) or not isinstance(c.get('target',\
          \ ''), str):\n            raise ValueError('action')\n        for k in ('query',\
          \ 'question'):\n            if not isinstance(c.get(k, ''), str) or len(c.get(k,\
          \ '')) > 1000:\n                raise ValueError('text')\n    return cs\n\
          \n\ndef route(raw):\n    out = dict(route='blocked', commands='[]', query='',\
          \ message='未可靠识别，本轮未执行。请重新描述。')\n    try:\n        cs = parse_commands(raw)\n\
          \        if any(c['intent'] == 'knowledge' for c in cs):\n            if\
          \ len(cs) != 1:\n                return dict(out, message='请把手册问题和操作分开发送，每次问一个手册问题。本轮未执行。')\n\
          \            q = cs[0].get('query', '').strip()\n            if not q:\n\
          \                return out\n            return dict(out, route='knowledge',\
          \ query=q[:400], commands=dump(cs), message='')\n        if len(cs) > 1:\n\
          \            return dict(out, route='multi', commands=dump(cs), message='')\n\
          \        i = cs[0]['intent']\n        if i in ('clarify', 'unsupported'):\n\
          \            return dict(out, message=cs[0].get('question') or '请说出明确操作。本演示不控制油门、刹车、转向或辅助驾驶。')\n\
          \        return dict(out, route=i if i in ('media','navigation') else 'vehicle',\
          \ commands=dump(cs), message='')\n    except Exception:\n        return\
          \ out\n\n\ndef execute(commands, state, speed, gear, speaker, network, confirmed=0,\
          \ mock_failure='none'):\n    \"\"\"Sequential commit per successful mock\
          \ receipt; stop at pending/failure.\"\"\"\n    s = load_state(state)\n \
          \   cs = json.loads(commands)\n    results = []\n    if not valid_context(speed,\
          \ gear, speaker, network):\n        s['pending'] = {}\n        return {'state':dump(s),'reply':'车况校验失败，本轮未执行。','display':'','status':'rejected'}\n\
          \    if not isinstance(cs,list) or not 1 <= len(cs) <= 5:\n        return\
          \ {'state':dump(s),'reply':'指令列表无效，本轮未执行。','display':'','status':'rejected'}\n\
          \    s['pending'] = {}\n    status = 'success'\n    def pending(idx, kind,\
          \ slot, question):\n        s['pending'] = dict(kind=kind, slot=slot, question=question,\
          \ commands=cs[idx:],\n                            speaker=speaker, expires=time.time()+120)\n\
          \        results.append('【待'+('确认' if kind=='confirm' else '补充')+'】'+question+'（120秒内有效，可说“取消”）')\n\
          \    for idx, c in enumerate(cs):\n        if not isinstance(c,dict):\n\
          \            results.append('【未执行】无效指令。'); status='rejected'; break\n  \
          \      i=c.get('intent'); a=c.get('action',''); t=c.get('target') or speaker;\
          \ val=c.get('value')\n        q=c.get('query','')\n        if not isinstance(q,str):\
          \ q=''\n        if i=='context':\n            last=s['last_by_seat'].get(speaker,{})\n\
          \            if time.time()-last.get('time',0)>300 or last.get('intent')!='window':\n\
          \                results.append('【未执行】请明确对象，例如“关闭主驾车窗”。'); status='clarify';\
          \ break\n            i='window'; t=last['target']; c.update(intent=i,target=t)\n\
          \        if i not in ('climate','window','trunk','media','navigation'):\n\
          \            results.append('【未执行】'+(c.get('question') or '不支持该操作或指令不明确。'));\
          \ status='rejected'; break\n        if t not in ('driver','passenger'):\n\
          \            pending(idx,'clarify','target','请说明主驾还是副驾。'); status='clarify';\
          \ break\n        draft=copy.deepcopy(s)\n        label='主驾' if t=='driver'\
