        code: "\"\"\"Deterministic simulated vehicle engine; no hardware/network access.\"\
          \"\"\nimport copy\nimport json\nimport math\nimport re\nimport time\n\n\
          INITIAL = {'driver_temperature': 24, 'passenger_temperature': 24,\n    \
          \       'driver_window_percent': 0, 'passenger_window_percent': 0,\n   \
          \        'trunk_open': False, 'playing': False, 'playlist': '',\n      \
          \     'destination': '', 'last_by_seat': {}, 'pending': {}}\n\n\ndef dump(value):\n\
          \    return json.dumps(value, ensure_ascii=False, allow_nan=False)\n\n\n\
          def load_state(raw):\n    s = json.loads(raw)\n    if not isinstance(s,\
          \ dict):\n        raise ValueError('invalid state')\n    out = copy.deepcopy(INITIAL)\n\
          \    out.update(s)\n    for seat in ('driver', 'passenger'):\n        for\
          \ suffix, lo, hi in (('_temperature', 16, 30), ('_window_percent', 0, 100)):\n\
          \            v = out[seat + suffix]\n            if type(v) not in (int,\
          \ float) or not math.isfinite(v) or not lo <= v <= hi:\n               \
          \ raise ValueError('invalid state value')\n    if not isinstance(out['pending'],\
          \ dict) or not isinstance(out['last_by_seat'], dict):\n        raise ValueError('invalid\
          \ memory')\n    return out\n\n\ndef valid_context(speed, gear, speaker,\
          \ network):\n    try:\n        n = float(speed)\n        return (math.isfinite(n)\
          \ and 0 <= n <= 250 and gear in ('P', 'D', 'R', 'N')\n                and\
          \ speaker in ('driver', 'passenger') and network in ('online', 'offline')\n\
          \                and not (gear == 'P' and n > 0))\n    except (TypeError,\
          \ ValueError):\n        return False\n\n\ndef prepare(state, utterance,\
          \ speaker, speed, gear, network):\n    \"\"\"Exact confirmation/slot replies\
          \ avoid another model call.\"\"\"\n    now = time.time()\n    q = str(utterance).strip()[:1000]\n\
          \    out = dict(mode='parse', state=state, context='{}', commands='[]',\
          \ confirmed=0,\n               message='', utterance=q)\n    try:\n    \
          \    s = load_state(state)\n    except Exception:\n        return dict(out,\
          \ mode='respond', message='会话状态异常，本轮未执行。请新建对话重试。')\n    pending = s.get('pending',\
          \ {})\n    exact = re.sub(r'[\\s。！!，,？?]', '', q)\n    cancel = exact in\
          \ ('取消', '算了', '不执行', '不要了')\n    confirm = exact in ('确认', '确认执行', '确定',\
          \ '是的')\n    expired = bool(pending) and now > pending.get('expires', 0)\n\
          \    if expired:\n        s['pending'] = {}; pending = {}\n    if not valid_context(speed,\
          \ gear, speaker, network):\n        s['pending'] = {}\n        return dict(out,\
          \ mode='respond', state=dump(s), message='模拟车况无效或车速与挡位冲突，本轮未执行。请检查预览输入。')\n\
          \    if cancel:\n        if pending and pending.get('speaker') != speaker:\n\
          \            msg = '请由发起操作的座位取消，本轮未执行。'\n        else:\n            s['pending']\
          \ = {}; msg = '已取消待处理操作，车辆模拟状态未改变。' if pending else '当前没有待处理操作。'\n     \
          \   return dict(out, mode='respond', state=dump(s), message=msg)\n    if\
          \ confirm:\n        if not pending:\n            msg = '待处理操作已过期，请重新发出完整指令。'\
          \ if expired else '当前没有可确认的操作，请说出完整指令。'\n            return dict(out, mode='respond',\
          \ state=dump(s), message=msg)\n        if pending.get('speaker') != speaker:\n\
          \            return dict(out, mode='respond', state=dump(s), message='请由发起操作的座位确认，本轮未执行。')\n\
          \        if pending.get('kind') != 'confirm':\n            return dict(out,\
          \ mode='respond', state=dump(s), message='还缺少具体信息，单说确认不能执行。' + pending.get('question',\
          \ ''))\n        commands = pending['commands']; s['pending'] = {}\n    \
          \    return dict(out, mode='direct', state=dump(s), commands=dump(commands),\
          \ confirmed=1)\n    if pending and pending.get('kind') == 'clarify' and\
          \ pending.get('speaker') == speaker:\n        commands = copy.deepcopy(pending['commands']);\
          \ c = commands[0]\n        slot = pending.get('slot'); accepted = False\n\
          \        if slot == 'value':\n            m = re.fullmatch(r'(-?\\d+(?:\\\
          .\\d+)?)(?:度|摄氏度|%|％)?', q)\n            if m:\n                c['value']\
          \ = float(m.group(1)); accepted = True\n        elif slot == 'target' and\
          \ exact in ('主驾', '副驾'):\n            c['target'] = 'driver' if exact ==\
          \ '主驾' else 'passenger'; accepted = True\n        elif slot == 'query' and\
          \ q.startswith('补充：') and len(q) > 3:\n            c['query'] = q[3:].strip()[:120];\
          \ accepted = True\n        elif slot == 'action' and exact in ('打开', '关闭'):\n\
          \            c['action'] = 'open' if exact == '打开' else 'close'; accepted\
          \ = True\n        if accepted:\n            s['pending'] = {}\n        \
          \    return dict(out, mode='direct', state=dump(s), commands=dump(commands))\n\
          \    # A new explicit task replaces only this speaker's unfinished task.\n\
